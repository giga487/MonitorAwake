[package]
name = "monitorawake"
version = "0.1.0"
description = "Un piccolo assistente desktop, locale e discreto"
edition = "2024"
license = "MIT"
default-run = "monitorawake"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-notification", "dep:tauri-plugin-opener"]

[lib]
name = "monitorawake"
path = "src/lib.rs"

[[bin]]
name = "monitorawake"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "monitorawake-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
dirs = "6"
fs2 = "0.4"
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri = { version = "2", features = ["devtools"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
